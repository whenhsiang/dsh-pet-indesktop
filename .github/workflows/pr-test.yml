name: PR Test Gate

# PR/push 门禁：测试 + ruff + bridge 零依赖门（macOS-only 产品）。
# 2026-11 macOS-only 收敛：原三平台矩阵（windows/ubuntu/macos，3.11/3.13 双版本）
# 收敛为单一 macos-latest + Python 3.13；Windows 分片脚本与 Linux tee-sys/前缀
# 诊断随之移除。push 触发分支加入 OnlyMacos（长期工作分支）。

on:
  pull_request:
  push:
    branches: [main, OnlyMacos]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要验证的 ref/SHA（留空 = 本 workflow 的触发 ref）'
        required: false
        type: string
        default: ''

# 同一 PR/分支的旧 run 自动取消：每次推送只为最新代码付 CI 的钱。
concurrency:
  group: pr-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.sha }}

      - name: Record resolved source SHA
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          {
            echo "### 源码版本"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| event | ${{ github.event_name }} |"
            echo "| checkout HEAD | $HEAD_SHA |"
            echo "| 摘要 | $(git log -1 --format=%s) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # bridge 门禁依赖 `node --test`（Node 20 无 glob，清单硬编码在下面）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 「这一轮到底装了什么」必须留痕：requirements.txt 全是 `>=` 无 lock，
      # 解析结果随上游漂移；imageio-ffmpeg 的 ffmpeg 构建是 webm 族时序 flake
      # 的已知差异源。
      - name: Record toolchain versions
        shell: bash
        run: |
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
          {
            echo "### 工具链"
            echo ""
            echo "- python: $(python --version 2>&1)"
            echo "- node: $(node --version)"
            echo ""
            echo "<details><summary>pip freeze</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pip-freeze.txt"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff
        run: ruff check pet/ tests/

      # 桥接插件零依赖门禁（2026-09 事故回归防线）：bridge 经 pnpm link: 链进
      # 用户 profile，任何外部 bare import 都会让用户开联动后整个 dsh 插件树
      # 加载失败。两层校验：node --test 跑全部 8 个 bridge 契约测试（原地 import
      # 捕获静态外部依赖回归）；verify_import.mjs 做 hermetic 校验（拷进无
      # node_modules 的临时目录 import + 清单零依赖 + envelope 形状 + 动态
      # import/require 静态禁令 + 临时目录祖先链污染探测）。
      # 注意：新增 bridge 测试文件时必须同步下面的显式清单（Node 20 无 glob）。
      - name: Bridge plugin zero-dependency gate
        run: |
          node --test tests/test_bridge_hardfailure.js tests/test_bridge_instance_scope.js tests/test_bridge_interaction_dedup.js tests/test_bridge_manifest.js tests/test_bridge_question_callid.js tests/test_bridge_retry.js tests/test_bridge_root_control.js tests/test_bridge_user_action_guard.js
          node integrations/dsh-pet-bridge/verify_import.mjs

      # 主套件（默认 fd 捕获 + -q；本仓无 capfd 用例与进程内读 stdin 的用例）。
      # 时序脆弱的三个族拆成下面的独立步骤，崩溃时只隔离失败那一步。
      - name: Pytest (main suite)
        id: main_suite
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py

      # webm 生命周期族（reader/ffmpeg 进程 teardown 竞态）在 macOS CI 上偶发段错误
      # （exit 139）。段错误会杀掉整个 pytest 进程，拆成独立步骤：崩溃时只隔离
      # 这一失败步骤，主套件结果照常产出。拆步骤不改变测试内容与红绿判定。
      - name: Pytest (webm lifecycle family, isolated)
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      # 低优预热让路族依赖真实线程编舞，时序窗口在满载 runner 上会被拉长；
      # 隔离 + 允许一次重跑：重跑仍红才算真失败。
      - name: Pytest (low-priority warm family, isolated + one retry)
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 族保留独立重跑位（崩溃杀进程时主套件报告不受影响），照跑照判红。
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py

      # 放在所有 pytest 步骤之后：失败时回读面包屑末尾（不输出两万多行）。
      - name: Pytest crash diagnostics
        if: failure()
        shell: bash
        run: |
          DIR="${RUNNER_TEMP:-$TMPDIR}/dspet-pytest-diag"
          if [ -f "$DIR/pytest-breadcrumb.txt" ]; then
            echo "::group::pytest-breadcrumb.txt (tail -30)"
            tail -n 30 "$DIR/pytest-breadcrumb.txt"
            echo "::endgroup::"
          fi
